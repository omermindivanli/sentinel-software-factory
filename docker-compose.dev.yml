# Development override for docker-compose
version: '3.8'

services:
  factory-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: uvicorn factory.dashboard.api.routes:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./factory:/app/factory
      - ./dashboard-frontend:/app/dashboard-frontend
      - ./tests:/app/tests
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FACTORY_ENV=development
      - PYTHONPATH=/app

  factory-dashboard:
    build:
      context: ./dashboard-frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./dashboard-frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000

  # Additional dev services
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - dev-tools