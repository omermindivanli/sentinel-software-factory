version: '3.8'

services:
  # Core API & Orchestration
  factory-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn factory.dashboard.api.routes:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - FACTORY_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=factory123
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./factory:/app/factory
      - ./tests:/app/tests
      - factory-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - chroma
      - neo4j
      - ollama
    networks:
      - factory-network

  # Frontend Dashboard
  factory-dashboard:
    build:
      context: ./dashboard-frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./dashboard-frontend:/app
      - /app/node_modules
    depends_on:
      - factory-api
    networks:
      - factory-network

  # Redis for KV cache, pub/sub, session state
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - factory-network

  # ChromaDB for vector storage (episodic memory)
  chroma:
    image: chromadb/chroma:0.5.5
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - ANONYMIZED_TELEMETRY=False
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  # Neo4j for knowledge graph (semantic memory)
  neo4j:
    image: neo4j:5.18-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
    environment:
      - NEO4J_AUTH=neo4j/factory123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1g
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "factory123", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - factory-network

  # Ollama for local models
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - factory-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - factory-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=factory123
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - factory-network

  # Optional: MCP servers
  mcp-github:
    image: mcp/github:latest
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    networks:
      - factory-network

  mcp-linear:
    image: mcp/linear:latest
    environment:
      - LINEAR_API_KEY=${LINEAR_API_KEY}
    networks:
      - factory-network

  mcp-slack:
    image: mcp/slack:latest
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
    networks:
      - factory-network

volumes:
  factory-data:
  redis-data:
  chroma-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  ollama-data:
  prometheus-data:
  grafana-data:

networks:
  factory-network:
    driver: bridge